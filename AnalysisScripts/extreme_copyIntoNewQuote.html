                                async function copyQuotedetailsWithParentLinkingAndXRate(quotedetailArray, newParentQuoteId) {
                                const idMapping = {}; // Map old quotedetail IDs to new quotedetail IDs

                                // Step 1: Create all quotedetail records without parent linking
                                for (const quotedetail of quotedetailArray) {


                                    const newPPU = quotedetail.extreme_supplierpriceperunit * parseFloat(kurs);
                                    const salesPPU = newPPU * quotedetail.extreme_margin;
                                    const newBaseamount = salesPPU * quotedetail.quantity;
                                    const newManualDiscountAmount = newBaseamount - (newBaseamount * (1 - quotedetail.extreme_discount / 100));
                                    const newFullpricewithdiscount = newBaseamount - newManualDiscountAmount;
                                    const newTax = newFullpricewithdiscount - (newFullpricewithdiscount * (1 - quotedetail.extreme_tax / 100));
                                    const newExtendedAmount = newTax + newFullpricewithdiscount;

                                    if(quotedetail.productid  === null){
                                        quotedetail.isproductoverridden = true;
                                    }

                                    let newQuotedetail = {
                                        "sequencenumber": quotedetail.sequencenumber,
                                        "ispriceoverridden": quotedetail.ispriceoverridden,
                                        "isproductoverridden": quotedetail.isproductoverridden,
                                        "extreme_createasset": quotedetail.extreme_createasset,
                                        "extreme_discount": quotedetail.extreme_discount,
                                        "extreme_isparentitem": quotedetail.extreme_isparentitem,
                                        "extreme_margin": quotedetail.extreme_margin,
                                        "quotedetailname": quotedetail.quotedetailname,
                                        "extreme_pricelistcurrency": quotedetail.extreme_pricelistcurrency,

                                        "extreme_supplierpriceperunit": newPPU,
                                        "extreme_supplierbaseamount": newPPU * quotedetail.quantity,
                                        "priceperunit": salesPPU,
                                        "baseamount": newBaseamount,
                                        "manualdiscountamount": newManualDiscountAmount,
                                        "extreme_fullpricewithdiscount": newFullpricewithdiscount,
                                        "tax": newTax,
                                        "extendedamount": newExtendedAmount,
                                        
                                        "extreme_pd": quotedetail.extreme_pd * parseFloat(kurs),
                                        "extreme_fullpd": quotedetail.extreme_fullpd * parseFloat(kurs),

                                        "extreme_pricelistpriceperunit": quotedetail.extreme_pricelistpriceperunit,
                                        "extreme_productdescription": quotedetail.extreme_productdescription,
                                        "extreme_customproductid": quotedetail.extreme_customproductid,
                                        "extreme_customproductname": quotedetail.extreme_customproductname,
                                        "extreme_producttype": quotedetail.extreme_producttype,
                                        "quantity": quotedetail.quantity,
                                        "extreme_supplierdiscount": quotedetail.extreme_supplierdiscount,
                                        "extreme_tax": quotedetail.extreme_tax,
                                        "extreme_uomid": quotedetail.extreme_uomid
                                    };

                                    // Add lookup bindings
                                    if (quotedetail.productid) {
                                        newQuotedetail["productid@odata.bind"] = `/products(${quotedetail.productid})`;
                                    }
                                    if (quotedetail.extreme_pricelist) {
                                        newQuotedetail["extreme_pricelist@odata.bind"] = `/pricelevels(${quotedetail.extreme_pricelist})`;
                                    }
                                    if (quotedetail.uomid) {
                                        newQuotedetail["uomid@odata.bind"] = `/uoms(${quotedetail.uomid})`;
                                    }
                                    if (quotedetail.extreme_vatgroup) {
                                        newQuotedetail["extreme_VATGroup@odata.bind"] = `/extreme_vatgroups(${quotedetail.extreme_vatgroup})`;
                                    }
                                    if (quotedetail.extreme_vatsetting) {
                                        newQuotedetail["extreme_VATSetting@odata.bind"] = `/extreme_vatsettings(${quotedetail.extreme_vatsetting})`;
                                    }
                                    if (quotedetail.extreme_area) {
                                        newQuotedetail["extreme_Area@odata.bind"] = `/extreme_areas(${quotedetail.extreme_area})`; // Lookup;
                                    }
                                    if (quotedetail.extreme_technology) {
                                        newQuotedetail["extreme_Technology@odata.bind"] = `/extreme_technologies(${quotedetail.extreme_technology})`;
                                    }
                                    if (quotedetail.extreme_vendorsupplier) {
                                        newQuotedetail["extreme_VendorSupplier@odata.bind"] = `/accounts(${quotedetail.extreme_vendorsupplier})`;
                                    }
                                    newQuotedetail["quoteid@odata.bind"] = `/quotes(${newId})`;

                                    try {
                                        const result = await Xrm.WebApi.createRecord("quotedetail", newQuotedetail);
                                        console.log(`Quotedetail copied successfully with ID: ${result.id}`);
                                        idMapping[quotedetail.quotedetailid] = result.id; // Map old ID to new ID
                                    } catch (error) {
                                        console.error(`Error creating quotedetail: ${error.message}`);
                                    }
                                }

                                // Step 2: Update parentquotedetail links for child records
                                for (const quotedetail of quotedetailArray) {
                                    if (quotedetail.extreme_parentquoteline && idMapping[quotedetail.extreme_parentquoteline]) {
                                        const updatedQuotedetail = {
                                            "extreme_ParentQuoteLine@odata.bind": `/quotedetails(${idMapping[quotedetail.extreme_parentquoteline]})`
                                        };

                                        try {
                                            await Xrm.WebApi.updateRecord(
                                                "quotedetail",
                                                idMapping[quotedetail.quotedetailid],
                                                updatedQuotedetail
                                            );
                                            console.log(
                                                `Parentquotedetail link updated for quotedetail ID: ${idMapping[quotedetail.quotedetailid]}`
                                            );
                                        } catch (error) {
                                            console.error(
                                                `Error updating parentquotedetail for quotedetail ID: ${idMapping[quotedetail.quotedetailid]} - ${error.message}`
                                            );
                                        }
                                    }
                                }
                            }
                                copyQuotedetailsWithParentLinkingAndXRate(originalQuoteDetailsXR, newId);

                            }

                            Xrm.Utility.closeProgressIndicator();
                            //ask user to open new quote in a new window
                            var confirmStrings = { text:"Quote successfully copied, do you want to open the new copy?", title:"Copy Quote Dialog" };
                            var confirmOptions = { height: 300, width: 450 };
                            Xrm.Navigation.openConfirmDialog(confirmStrings, confirmOptions).then(
                            function (success) {    
                                if (success.confirmed) {
                                var entityFormOptions = {};
                                entityFormOptions["openInNewWindow"] = true;
                                entityFormOptions["entityName"] = "quote";
                                entityFormOptions["entityId"] = newId;

                                // Open the form.
                                Xrm.Navigation.openForm(entityFormOptions).then(
                                    function (success) {
                                        console.log(success);
                                    },
                                    function (error) {
                                        console.log(error);
                                    });
                                }
                                else
                                    console.log("Dialog closed using Cancel button or X.");
                            });
                        }
                    });
                });
            } else {
                console.error("Xrm nije definisan. Uverite se da se ovo izvrsava u Dynamics 365 okruzenju.");
            }
            async function readConfigurationValue(Xrm, key) {
                // eslint-disable-next-line no-undef
                var value = await Xrm.WebApi.retrieveMultipleRecords("extreme_configuration", `?$select=extreme_value&$filter=extreme_key eq '${key}'&$top=1`).then(
                    function success(results) {
                        return results.entities[0]["extreme_value"];
                    },
                    function (error) {
                        console.log(error.message);
                    }
                );
                return value;
            }
        });
